name: Bootstrap site binaries
on:
  push:
    branches: [main]
jobs:
  bootstrap:
    if: hashFiles('_payload.json') != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode binaries and enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, base64, pathlib
          payload = json.loads(pathlib.Path("_payload.json").read_text())
          for path, b64 in payload.items():
              dest = pathlib.Path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(b64))
              print("wrote", dest, dest.stat().st_size)
          PY
          rm -f _payload.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/spoon.jpg img/spread.jpg img/litter.png Cat_Sitter_Guide.pdf
          git rm -f _payload.json
          git commit -m "Add site images and PDF"
          git push
          set +e
          echo "Enabling GitHub Pages from main /"
          gh api --method POST /repos/kbitson/cat-sitter/pages --input - <<'EOF'
          {"source":{"branch":"main","path":"/"}}
          EOF
          post_status=$?
          echo "POST pages exit: $post_status"
          if [ "$post_status" -ne 0 ]; then
            gh api --method PUT /repos/kbitson/cat-sitter/pages --input - <<'EOF'
          {"source":{"branch":"main","path":"/"}}
          EOF
            echo "PUT pages exit: $?"
          fi
